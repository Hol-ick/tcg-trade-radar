name: Collect weekly snapshot

on:
  schedule:
    - cron: "20 1 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 (YYYY-MM-DD)"
        required: true
        type: string
      until:
        description: "종료일 (시작일 포함 7일째, YYYY-MM-DD)"
        required: true
        type: string
      gallery_id:
        description: "갤러리 ID"
        required: true
        default: tcggame
        type: choice
        options:
          - tcggame
          - onepiececardgame
          - pokemoncardgame
          - digimontcg
          - vg

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: python -m pip install -e .
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Resolve scheduled range
        id: period
        shell: bash
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            echo "since=${{ inputs.since }}" >> "$GITHUB_OUTPUT"
            echo "until=${{ inputs.until }}" >> "$GITHUB_OUTPUT"
            echo "gallery=${{ inputs.gallery_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "since=$(date -u -d '7 days ago' +%F)" >> "$GITHUB_OUTPUT"
            echo "until=$(date -u -d '1 day ago' +%F)" >> "$GITHUB_OUTPUT"
            echo "gallery=tcggame" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect and publish
        run: >-
          python scripts/export_week_snapshot.py
          --since "${{ steps.period.outputs.since }}"
          --until "${{ steps.period.outputs.until }}"
          --gallery-id "${{ steps.period.outputs.gallery }}"
      - name: Commit snapshot
        run: |
          git config user.name "tcg-trade-radar bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/weeks
          git diff --cached --quiet || git commit -m "data: publish weekly collection snapshot"
          git push
