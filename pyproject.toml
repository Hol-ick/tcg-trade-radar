[project]
name = "tcg-trade-radar"
version = "0.1.1"
description = "DCInside TCG user trade market explorer"
requires-python = ">=3.11"
dependencies = ["playwright>=1.62,<2", "PySide6>=6.8,<7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kaitori_collector*"]

[project.scripts]
kaitori-collector = "kaitori_collector.cli:main"
